{{template "_header" .}}
<div class="page-header">
    <h1>{{.Title}}</h1>
</div>

{{if .Data}}{{if .Data.Error}}<div class="form-error">{{.Data.Error}} <a href="/profile/ai">AI Provider</a></div>{{end}}{{end}}

<form method="POST" action="/decks/new-ai">
    <div>
        <label for="name">Deck Name</label>
        <input type="text" id="name" name="name" required
            placeholder="e.g. German Verbs 1"
            value="{{if .Data}}{{.Data.Name}}{{end}}">
    </div>

    <div>
        <label for="language">Target Language</label>
        <input type="text" id="language" name="language" required
            placeholder="e.g. German, Spanish, French"
            value="{{if .Data}}{{.Data.Language}}{{end}}">
    </div>

    <div>
        <label for="prompt">What to generate</label>
        <textarea id="prompt" name="prompt" required
            placeholder="e.g. 300 most used verbs, common kitchen vocabulary">{{if .Data}}{{.Data.Prompt}}{{end}}</textarea>
    </div>

    {{template "_mode_picker" (or (and .Data .Data.Mode) "srs")}}

    <div>
        <button type="submit" class="btn btn-primary">Generate Cards</button>
        <a href="/decks/new" class="btn">Back</a>
    </div>
</form>
{{template "_footer" .}}
