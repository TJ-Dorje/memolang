{{template "_header" .}}
<div class="page-header">
    <h1>{{.Title}}</h1>
</div>

<div class="ai-spinner">
    <div class="spinner-ring"></div>
    <p>Asking the AI to generate your cards&hellip;</p>
    <p class="sub">This may take a minute for large requests.</p>
</div>

<meta http-equiv="refresh" content="0;url=/decks/new-ai/execute?token={{.Data.Token}}">

<style>
.ai-spinner {
    text-align: center;
    padding: 4rem 2rem;
}
.spinner-ring {
    display: inline-block;
    width: 48px;
    height: 48px;
    border: 4px solid #e0e0e0;
    border-top: 4px solid #f0ad4e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 1.5rem;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
.ai-spinner p {
    margin: 0.25rem 0;
    color: #555;
}
.ai-spinner .sub {
    font-size: 0.85rem;
    color: #999;
}
</style>
{{template "_footer" .}}
