{{template "_header" .}}
<div class="page-header">
    <h1>Forgot password</h1>
</div>

<p>Enter your account's email address. We'll send you a 6-digit code to
   choose a new password.</p>

{{if .Data.Error}}<div class="form-error">{{.Data.Error}}</div>{{end}}

<form method="POST" action="/forgot">
    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus
            autocomplete="email" value="{{.Data.Email}}">
    </div>
    <div>
        <button type="submit" class="btn btn-primary">Send Code</button>
        <a href="/login" class="btn">Back to log in</a>
    </div>
</form>
{{template "_footer" .}}
