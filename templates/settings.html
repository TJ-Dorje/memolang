{{template "_header" .}}
<div class="page-header">
    <h1>Settings</h1>
</div>

{{if .Data}}{{if .Data.Error}}<div class="form-error">{{.Data.Error}}</div>{{end}}{{end}}

<h2>LLM Provider</h2>

<form method="POST" action="/settings">
    <div>
        <label for="provider">Provider</label>
        <select name="provider" id="provider">
            <option value="ollama" {{if eq .Data.Provider "ollama"}}selected{{end}}>Ollama (local)</option>
            <option value="openai" {{if eq .Data.Provider "openai"}}selected{{end}}>OpenAI</option>
            <option value="anthropic" {{if eq .Data.Provider "anthropic"}}selected{{end}}>Anthropic</option>
            <option value="custom" {{if eq .Data.Provider "custom"}}selected{{end}}>Custom (OpenAI-compatible)</option>
        </select>
    </div>

    <div>
        <label for="base_url">Base URL</label>
        <input type="text" id="base_url" name="base_url"
            value="{{.Data.BaseURL}}"
            placeholder="e.g. http://localhost:11434/v1">
        <small class="hint">Ollama: <code>http://localhost:11434/v1</code> · OpenAI: <code>https://api.openai.com/v1</code> · Anthropic: <code>https://api.anthropic.com</code></small>
    </div>

    <div>
        <label for="api_key">API Key</label>
        <input type="password" id="api_key" name="api_key"
            placeholder="{{if .Data.HasAPIKey}}•••••••• (saved — leave blank to keep){{else}}API key (optional for local){{end}}">
        {{if .Data.HasAPIKey}}
        <label class="checkbox-label">
            <input type="checkbox" name="clear_api_key" value="1"> Clear saved key
        </label>
        {{end}}
    </div>

    <div>
        <label for="model">Model</label>
        <input type="text" id="model" name="model"
            value="{{.Data.Model}}"
            placeholder="e.g. llama3, gpt-4o-mini, claude-sonnet-5">
    </div>

    <div>
        <button type="submit" class="btn btn-primary">Save</button>
    </div>
</form>

<form method="POST" action="/settings/test">
    <button type="submit" class="btn">Test Connection</button>
</form>
{{template "_footer" .}}
